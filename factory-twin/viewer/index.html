<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Twin Viewer</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --fg:#e6e6e6; --muted:#9aa3b2; --accent:#4fc3f7; --warn:#ffb74d; --bad:#ef5350; --ok:#66bb6a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font: 13px/1.4 -apple-system, "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif; overflow:hidden; }
  #c { position:fixed; inset:0; }
  .panel { position:fixed; background:rgba(23,26,33,.92); border:1px solid #2a2f3a; border-radius:8px; padding:10px 12px; backdrop-filter: blur(6px); }
  #top { top:10px; left:10px; right:10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #top select, #top button, #top input[type=range] { background:#222634; color:var(--fg); border:1px solid #333a4a; border-radius:6px; padding:5px 8px; font-size:13px; }
  #top button { cursor:pointer; } #top button:hover { border-color:var(--accent); }
  #time { font-variant-numeric: tabular-nums; min-width:170px; }
  #kpi { top:64px; right:10px; width:330px; max-height:calc(100vh - 80px); overflow:auto; }
  #kpi h3 { margin:6px 0 4px; font-size:13px; color:var(--accent); }
  #kpi table { width:100%; border-collapse:collapse; font-size:12px; }
  #kpi td { padding:2px 4px; border-bottom:1px solid #262b36; vertical-align:top; } #kpi td:first-child { width:52%; }
  #kpi td:last-child { text-align:right; font-variant-numeric: tabular-nums; }
  .bar { height:6px; background:#2a2f3a; border-radius:3px; overflow:hidden; } .bar > i { display:block; height:100%; background:var(--accent); }
  #legend { bottom:10px; left:10px; font-size:12px; color:var(--muted); }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  #info { bottom:10px; right:10px; width:330px; min-height:60px; font-size:12px; white-space:pre-wrap; color:var(--muted); }
  .label { color:#fff; font-size:11px; background:rgba(0,0,0,.55); padding:1px 5px; border-radius:4px; white-space:nowrap; pointer-events:none; }
  .label.q { background:rgba(239,83,80,.8); font-weight:600; }
  label.chk { color:var(--muted); cursor:pointer; user-select:none; }
  #scn { max-width:360px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="panel">
  <select id="scn"></select>
  <button id="play">▶ 재생</button>
  <span id="time">Day 1 08:00</span>
  <input id="seek" type="range" min="0" max="1000" value="0" style="flex:1; min-width:200px">
  <span>속도 <input id="speed" type="range" min="1" max="600" value="60" style="width:110px"> <span id="speedv">×60</span></span>
  <label class="chk"><input type="checkbox" id="heat"> 통행 히트맵</label>
  <label class="chk"><input type="checkbox" id="spag" checked> 동선(스파게티)</label>
  <label class="chk"><input type="checkbox" id="labels" checked> 라벨</label>
  <button id="top-view">평면</button><button id="iso-view">3D</button>
</div>
<div id="kpi" class="panel"></div>
<div id="legend" class="panel">
  <span class="sw" style="background:#66bb6a"></span>가동 &nbsp; <span class="sw" style="background:#9e9e9e"></span>대기 &nbsp; <span class="sw" style="background:#ffb74d"></span>셋업 &nbsp; <span class="sw" style="background:#ef5350"></span>고장 &nbsp;
  <span class="sw" style="background:#4fc3f7"></span>대차/운반자 &nbsp; <span class="sw" style="background:#ffee58"></span>지게차 &nbsp; <span class="sw" style="background:#ff8a65"></span>배치(부품) &nbsp; | 드래그: 회전, 휠: 줌, 우클릭: 이동, 기계 클릭: 상세
</div>
<div id="info" class="panel">기계를 클릭하면 상세 KPI가 표시됩니다.</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js",
               "three/addons/": "./vendor/three/addons/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const OUT = '../sim/out/';
const $ = s => document.querySelector(s);
const STATE_COLOR = { idle:0x9e9e9e, busy:0x66bb6a, setup:0xffb74d, down:0xef5350 };

// ---------- renderer / scene ----------
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
const labelRenderer = new CSS2DRenderer(); labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position:'fixed', top:0, left:0, pointerEvents:'none' });
document.body.appendChild(labelRenderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0f1115);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 1000);
const controls = new OrbitControls(camera, canvas); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(30, 60, 20); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left:-50, right:50, top:50, bottom:-50, far:200 });
scene.add(sun);
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight); });

// 좌표계: 데이터 (x, y평면) → three (x, 높이, -y) 로 매핑 (y 데이터가 화면 위쪽이 되도록)
const P = (x, y, h=0) => new THREE.Vector3(x, h, -y);

let factory, kpis, events = [], meta = { tmax: 1 };
let world = new THREE.Group(); scene.add(world);
const stationMesh = {}, stationLabel = {}, queueLabel = {}, queueStack = {}, vehicles = {}, batchMesh = {};
let heatPlane, heatTex, spagLines, labelsVisible = true;

function clearWorld() { scene.remove(world); world = new THREE.Group(); scene.add(world);
  for (const k in stationMesh) delete stationMesh[k]; for (const k in vehicles) delete vehicles[k]; for (const k in queueStack) delete queueStack[k]; for (const k in batchMesh) delete batchMesh[k]; }

function makeLabel(text, cls='label') { const d = document.createElement('div'); d.className = cls; d.textContent = text; const o = new CSS2DObject(d); return o; }

function buildFactory(f) {
  clearWorld();
  const { width:W, depth:D } = f.site;
  // 바닥
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshStandardMaterial({ color:0x2b2f38, roughness:0.95 }));
  floor.rotation.x = -Math.PI/2; floor.position.set(W/2, 0, -D/2); floor.receiveShadow = true; world.add(floor);
  const grid = new THREE.GridHelper(Math.max(W, D), Math.max(W, D), 0x3a4050, 0x262b36); grid.position.set(W/2, 0.01, -D/2); world.add(grid);
  // 구역
  for (const z of f.site.zones) {
    const shape = new THREE.Shape(z.polygon.map(([x, y]) => new THREE.Vector2(x, y)));  // rotation.x=-90° 가 (x,y)→(x,0,-y) 로 매핑
    const m = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color: new THREE.Color(z.color || '#888'), transparent:true, opacity: z.type === 'aisle' ? 0.08 : 0.16, depthWrite:false }));
    m.rotation.x = -Math.PI/2; m.position.y = 0.02; world.add(m);
    const xs = z.polygon.map(p => p[0]), ys = z.polygon.map(p => p[1]);
    const lab = makeLabel(z.name); lab.element.style.color = z.color; lab.element.style.background = 'transparent'; lab.element.style.fontSize = '12px'; lab.element.style.opacity = .85;
    lab.position.copy(P((Math.min(...xs)+Math.max(...xs))/2, Math.max(...ys) - 1.2, 0.05)); world.add(lab);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: new THREE.Color(z.color), transparent:true, opacity:.5 }));
    edges.rotation.x = -Math.PI/2; edges.position.y = 0.03; world.add(edges);
  }
  // 기둥
  for (const [x, y, w, d] of (f.site.obstacles || [])) {
    const c = new THREE.Mesh(new THREE.BoxGeometry(w, 7, d), new THREE.MeshStandardMaterial({ color:0x666a75 })); c.position.copy(P(x + w/2, y + d/2, 3.5)); c.castShadow = true; world.add(c);
  }
  // 벽 (외곽)
  const wallMat = new THREE.MeshStandardMaterial({ color:0x3b4150, transparent:true, opacity:.35, side:THREE.DoubleSide });
  for (const [x, y, w, d] of [[0, 0, W, .2], [0, D-.2, W, .2], [0, 0, .2, D], [W-.2, 0, .2, D]]) {
    const wm = new THREE.Mesh(new THREE.BoxGeometry(w, 7, d), wallMat); wm.position.copy(P(x+w/2, y+d/2, 3.5)); world.add(wm);
  }
  // 기계
  for (const s of f.stations) {
    const [L, Wd, H] = s.size; const isStore = s.process === 'raw' || s.process === 'fg';
    const mat = new THREE.MeshStandardMaterial({ color: isStore ? 0x6d4c41 : STATE_COLOR.idle, roughness:.6, metalness: isStore ? 0 : .3, transparent:isStore, opacity:isStore ? .5 : 1 });
    const m = new THREE.Mesh(new THREE.BoxGeometry(L, H, Wd), mat); m.position.copy(P(s.pos[0], s.pos[1], H/2)); m.rotation.y = -(s.rotation_deg || 0) * Math.PI/180;
    m.castShadow = true; m.receiveShadow = true; m.userData.station = s.id; world.add(m); stationMesh[s.id] = m;
    const lab = makeLabel(`${s.id} ${s.name}`); lab.position.copy(P(s.pos[0], s.pos[1], H + 0.8)); world.add(lab); stationLabel[s.id] = lab;
    if (!isStore) { const stack = []; for (let i = 0; i < 8; i++) { const bx = new THREE.Mesh(new THREE.BoxGeometry(1.2, .25, .8), new THREE.MeshStandardMaterial({ color: 0xff8a65 })); bx.position.copy(P(s.in_pos[0], s.in_pos[1], .15 + i * .28)); bx.visible = false; bx.castShadow = true; world.add(bx); stack.push(bx); } queueStack[s.id] = stack;
      const q = makeLabel('', 'label q'); q.position.copy(P(s.in_pos[0], s.in_pos[1], 1.2)); q.visible = false; world.add(q); queueLabel[s.id] = q;
      const bufMk = new THREE.Mesh(new THREE.CircleGeometry(.6, 16), new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:.15 })); bufMk.rotation.x = -Math.PI/2; bufMk.position.copy(P(s.in_pos[0], s.in_pos[1], .04)); world.add(bufMk); }
  }
  // 부대설비
  for (const a of (f.ancillary || [])) { if (!a.pos) continue; const [L, Wd, H] = a.size || [1.5, 1.5, 2];
    const m = new THREE.Mesh(new THREE.CylinderGeometry(L/2, L/2, H, 20), new THREE.MeshStandardMaterial({ color:0x546e7a })); m.position.copy(P(a.pos[0], a.pos[1], H/2)); m.castShadow = true; world.add(m);
    const lab = makeLabel(a.name); lab.position.copy(P(a.pos[0], a.pos[1], H + .6)); lab.element.style.opacity = .7; world.add(lab); }
  // 운반 차량
  const tr = f.transport || {};
  for (let i = 1; i <= (tr.handlers || 1); i++) vehicles['H' + i] = makeVehicle('H' + i, 0x4fc3f7, false);
  for (let i = 1; i <= (tr.forklifts || 1); i++) vehicles['F' + i] = makeVehicle('F' + i, 0xffee58, true);
  // 히트맵 평면
  const gx = Math.ceil(W / 0.5), gy = Math.ceil(D / 0.5);
  heatTex = new THREE.DataTexture(new Uint8Array(gx * gy * 4), gx, gy); heatTex.needsUpdate = true;
  heatPlane = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshBasicMaterial({ map: heatTex, transparent:true, opacity:.85, depthWrite:false }));
  heatPlane.rotation.x = -Math.PI/2; heatPlane.position.set(W/2, 0.06, -D/2); heatPlane.visible = $('#heat').checked; world.add(heatPlane);
  heatPlane.userData = { gx, gy, W, D };
  setIso();
}
function makeVehicle(id, color, fork) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(fork ? new THREE.BoxGeometry(2.2, 1.0, 1.1) : new THREE.CapsuleGeometry(.25, .9, 4, 8), new THREE.MeshStandardMaterial({ color }));
  body.position.y = fork ? .5 : .8; body.castShadow = true; g.add(body);
  if (!fork) { const cart = new THREE.Mesh(new THREE.BoxGeometry(1.2, .1, .8), new THREE.MeshStandardMaterial({ color:0x8d6e63 })); cart.position.set(.9, .5, 0); g.add(cart); g.userData.cart = cart; }
  const load = new THREE.Mesh(new THREE.BoxGeometry(fork ? 1.2 : 1.0, .4, fork ? 1.0 : .7), new THREE.MeshStandardMaterial({ color:0xff8a65 })); load.position.set(fork ? 1.6 : .9, fork ? .9 : .8, 0); load.visible = false; g.add(load); g.userData.load = load;
  const lab = makeLabel(id); lab.position.y = 2; g.add(lab); g.userData.label = lab;
  g.visible = false; world.add(g); return g;
}

// ---------- 이벤트 로그 → 타임라인 ----------
let moves = [], stateEv = [], queueEv = [], procEv = [], batchPos = {};
function indexEvents(evs) {
  moves = evs.filter(e => e.type === 'move'); stateEv = evs.filter(e => e.type === 'state'); queueEv = evs.filter(e => e.type === 'queue');
  procEv = evs.filter(e => e.type === 'proc_start' || e.type === 'proc_end' || e.type === 'arrive' || e.type === 'done');
  meta.tmax = Math.max(...evs.map(e => e.t)) + 1;
  buildHeat(); buildSpaghetti();
}
function buildHeat() {
  const { gx, gy, W, D } = heatPlane.userData; const acc = new Float32Array(gx * gy);
  for (const m of moves) { const p = m.path; for (let i = 0; i < p.length - 1; i++) { const n = Math.ceil(Math.hypot(p[i+1][0]-p[i][0], p[i+1][1]-p[i][1]) / .5) + 1;
    for (let k = 0; k <= n; k++) { const x = p[i][0] + (p[i+1][0]-p[i][0]) * k / n, y = p[i][1] + (p[i+1][1]-p[i][1]) * k / n;
      const ix = Math.min(gx-1, Math.max(0, Math.floor(x / W * gx))), iy = Math.min(gy-1, Math.max(0, Math.floor(y / D * gy))); acc[iy * gx + ix] += m.loaded ? 1.5 : 1; } } }
  const mx = Math.max(1, ...acc); const d = heatTex.image.data;
  for (let i = 0; i < gx * gy; i++) { const v = Math.pow(acc[i] / mx, .5); const [r, g, b] = ramp(v); d[i*4] = r; d[i*4+1] = g; d[i*4+2] = b; d[i*4+3] = v > 0 ? Math.min(255, 40 + v * 215) : 0; }
  heatTex.needsUpdate = true;
}
function ramp(v) { // 파랑→초록→노랑→빨강
  const stops = [[0, 30, 60, 200], [.33, 40, 200, 120], [.66, 250, 220, 50], [1, 240, 50, 40]];
  for (let i = 0; i < stops.length - 1; i++) { const [a, ...ca] = stops[i], [b, ...cb] = stops[i+1]; if (v <= b) { const t = (v - a) / (b - a); return ca.map((c, j) => c + (cb[j] - c) * t); } } return [240, 50, 40];
}
function buildSpaghetti() {
  if (spagLines) world.remove(spagLines);
  const pts = [], cols = [];
  for (const m of moves) { const c = new THREE.Color(m.vehicle[0] === 'F' ? 0xffee58 : (m.loaded ? 0x4fc3f7 : 0x4fc3f7)); const op = m.loaded ? 1 : .35;
    for (let i = 0; i < m.path.length - 1; i++) { pts.push(P(m.path[i][0], m.path[i][1], .12), P(m.path[i+1][0], m.path[i+1][1], .12)); cols.push(c.r*op, c.g*op, c.b*op, c.r*op, c.g*op, c.b*op); } }
  const g = new THREE.BufferGeometry().setFromPoints(pts); g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  spagLines = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ vertexColors:true, transparent:true, opacity:.5 })); spagLines.visible = $('#spag').checked; world.add(spagLines);
}

// ---------- 재생 ----------
let t = 0, playing = false, speed = 60, lastFrame = performance.now();
let cursors = { state:0, queue:0, proc:0 }; const stState = {}, stQueue = {};
function seek(nt) { t = nt; cursors = { state:0, queue:0, proc:0 }; for (const k in stState) delete stState[k]; for (const k in stQueue) delete stQueue[k]; applyUntil(); }
function applyUntil() {
  while (cursors.state < stateEv.length && stateEv[cursors.state].t <= t) { const e = stateEv[cursors.state++]; stState[e.station] = e.state; }
  while (cursors.queue < queueEv.length && queueEv[cursors.queue].t <= t) { const e = queueEv[cursors.queue++]; stQueue[e.station] = e.len; }
  for (const id in stationMesh) { const s = factory.stations.find(x => x.id === id); if (s.process === 'raw' || s.process === 'fg') continue;
    stationMesh[id].material.color.setHex(STATE_COLOR[stState[id] || 'idle']); const q = stQueue[id] || 0; queueLabel[id].visible = labelsVisible && q > 0; queueLabel[id].element.textContent = `대기 ${q}`; (queueStack[id] || []).forEach((bx, i) => bx.visible = i < q); }
  // 차량 위치: 현재 시각에 진행 중인 move 를 찾아 보간
  for (const vid in vehicles) vehicles[vid].userData.active = false;
  for (const m of moves) { if (m.t > t) break; const v = vehicles[m.vehicle]; if (!v) continue; const end = m.t + m.duration;
    if (t <= end || !v.userData.active) { const f = m.duration > 0 ? Math.min(1, (t - m.t) / m.duration) : 1; const [x, y, ang] = alongPath(m.path, f); v.position.copy(P(x, y, 0)); v.rotation.y = ang; v.visible = true; v.userData.load.visible = m.loaded && t < end; v.userData.active = t <= end; } }
  const day = Math.floor(t / 1440) + 1, hm = t % 1440; $('#time').textContent = `Day ${day} ${String(Math.floor(hm/60)).padStart(2,'0')}:${String(Math.floor(hm%60)).padStart(2,'0')}`;
  $('#seek').value = Math.round(t / meta.tmax * 1000);
}
function alongPath(path, f) { let L = 0; const segs = []; for (let i = 0; i < path.length - 1; i++) { const d = Math.hypot(path[i+1][0]-path[i][0], path[i+1][1]-path[i][1]); segs.push(d); L += d; }
  let target = f * L; for (let i = 0; i < segs.length; i++) { if (target <= segs[i] || i === segs.length - 1) { const u = segs[i] ? target / segs[i] : 1; const x = path[i][0] + (path[i+1][0]-path[i][0]) * u, y = path[i][1] + (path[i+1][1]-path[i][1]) * u; return [x, y, Math.atan2(path[i+1][1]-path[i][1], path[i+1][0]-path[i][0])]; } target -= segs[i]; }
  return [path[0][0], path[0][1], 0]; }

function animate(now) { requestAnimationFrame(animate); const dt = (now - lastFrame) / 1000; lastFrame = now;
  if (playing) { const nt = t + dt * speed / 60; if (nt >= meta.tmax) { playing = false; $('#play').textContent = '▶ 재생'; } else { // 야간(비근무) 건너뛰기
      const sh = factory.meta.shift, s0 = hhmm(sh.start), s1 = hhmm(sh.end), hm = nt % 1440; if (hm >= s1) seek(Math.floor(nt/1440) * 1440 + 1440 + s0); else if (hm < s0) seek(Math.floor(nt/1440)*1440 + s0); else { t = nt; applyUntil(); } } }
  controls.update(); renderer.render(scene, camera); labelRenderer.render(scene, camera); }
const hhmm = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };

// ---------- UI ----------
$('#play').onclick = () => { playing = !playing; $('#play').textContent = playing ? '⏸ 일시정지' : '▶ 재생'; };
$('#seek').oninput = e => seek(e.target.value / 1000 * meta.tmax);
$('#speed').oninput = e => { speed = +e.target.value; $('#speedv').textContent = '×' + speed; };
$('#heat').onchange = e => heatPlane.visible = e.target.checked; $('#spag').onchange = e => spagLines.visible = e.target.checked;
$('#labels').onchange = e => { labelsVisible = e.target.checked; for (const k in stationLabel) stationLabel[k].visible = labelsVisible; applyUntil(); };
function setIso() { const { width:W, depth:D } = factory.site; camera.position.set(W/2 + 10, 45, -D/2 + 45); controls.target.copy(P(W/2, D/2, 0)); }
function setTop() { const { width:W, depth:D } = factory.site; camera.position.set(W/2, 75, -D/2 + .01); controls.target.copy(P(W/2, D/2, 0)); }
$('#top-view').onclick = setTop; $('#iso-view').onclick = setIso;
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
canvas.addEventListener('click', e => { mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(Object.values(stationMesh))[0]; if (!hit) return; const id = hit.object.userData.station; const s = factory.stations.find(x => x.id === id); const k = kpis.stations[id];
  let txt = `${s.id} ${s.name}\n공정: ${s.process} | 대수: ${s.capacity} | 작업자: ${s.workers_required}명 | 정격 ${s.rated_kw} kW (부하율 ${s.load_factor})\n위치 (${s.pos}) 크기 ${s.size.join('×')} m\n`;
  if (k) txt += `가동률 ${(k.utilization*100).toFixed(0)}% | 가동 ${k.busy_min}분 셋업 ${k.setup_min}분 고장 ${k.down_min}분 블로킹 ${k.blocked_min}분\n배치 ${k.batches} / 부품 ${k.parts}개 | 평균 대기 ${k.avg_queue_wait_min}분 (최대 ${k.max_queue_wait_min}) | 평균 대기열 ${k.avg_queue_len}\n전력 ${k.energy_kwh} kWh`;
  if (s.cycle) txt += `\n사이클: ${JSON.stringify(s.cycle)}`; $('#info').textContent = txt; });

function renderKpi(k) {
  const a = k.aggregate || {}; const f = v => Array.isArray(v) ? `${v[0]} ±${v[1]}` : v;
  let h = `<h3>${k.scenario?.name || ''}</h3>`;
  if (k.scenario?.hypothesis) h += `<div style="color:var(--muted);font-size:11px;margin-bottom:6px">${k.scenario.hypothesis}</div>`;
  h += `<table>
  <tr><td>기간</td><td>${k.horizon_days}일 (교대 ${k.shift_min_per_day}분/일)</td></tr>
  <tr><td>주문 접수/투입/완료</td><td>${k.orders_received ?? '-'} / ${k.orders_released} / ${k.orders_completed}</td></tr>
  <tr><td>처리량 (제품/일)</td><td>${f(a.throughput_per_day ?? k.throughput_products_per_day)}</td></tr>
  <tr><td>리드타임 (작업시간 기준, 분)</td><td>${f(a.lead_work_min ?? k.lead_time_work_min_avg)}</td></tr>
  <tr><td>리드타임 (달력, 분) 평균/P90</td><td>${k.lead_time_min.avg} / ${k.lead_time_min.p90}</td></tr>
  <tr><td>평균 WIP (배치)</td><td>${f(a.wip ?? k.avg_wip_batches)}</td></tr>
  <tr><td>불량 부품</td><td>${k.scrap_parts}</td></tr>
  ${k.on_time_ratio != null ? `<tr><td>납기준수율 (시공일 기준)</td><td>${(k.on_time_ratio*100).toFixed(0)}%</td></tr>` : ''}
  ${k.outsourced_wait_avg_min != null ? `<tr><td>외주 입고 대기 (분/주문)</td><td>${k.outsourced_wait_avg_min}</td></tr>` : ''}
  ${k.cut_batching ? `<tr><td>묶음 재단 (배치 수 / 주문·배치)</td><td>${k.cut_batching.cut_batches} / ${k.cut_batching.orders_per_cut_batch}</td></tr>` : ''}
  <tr><td>정상상태 처리량 (워밍업 ${k.warmup_days}일 제외)</td><td>${k.throughput_steady_per_day}</td></tr>
  <tr><td>운반자 / 지게차 가동률</td><td>${(k.transport.handler_utilization*100).toFixed(0)}% / ${(k.transport.forklift_utilization*100).toFixed(0)}%</td></tr>
  <tr><td>운반거리 (적재/공차, m)</td><td>${k.transport.loaded_distance_m} / ${k.transport.empty_distance_m}</td></tr>
  <tr><td>운반거리 / 제품</td><td>${k.transport.distance_per_product_m} m</td></tr>
  <tr><td>전력 (kWh / 비용)</td><td>${k.energy.total_kwh} kWh / ₩${k.energy.cost_krw.toLocaleString()}</td></tr>
  <tr><td>kWh / 제품</td><td>${k.energy.kwh_per_product}</td></tr>
  ${k.scenario?.capex_krw ? `<tr><td>투자비 (CAPEX)</td><td>₩${k.scenario.capex_krw.toLocaleString()}</td></tr>` : ''}
  </table><h3>병목 순위 (가동률 + 대기)</h3><table>`;
  for (const b of k.bottleneck_ranking) h += `<tr><td>${b.station} <span style="color:var(--muted)">${k.stations[b.station].name}</span></td><td>${(b.utilization*100).toFixed(0)}% / 대기 ${b.avg_queue_wait_min}분</td></tr>`;
  h += `</table><h3>스테이션 가동률</h3>`;
  for (const [id, s] of Object.entries(k.stations)) { const u = Math.round(s.utilization*100); h += `<div style="display:flex;gap:6px;align-items:center;margin:2px 0"><span style="width:52px">${id}</span><div class="bar" style="flex:1"><i style="width:${u}%;background:${u>80?'var(--bad)':u>60?'var(--warn)':'var(--accent)'}"></i></div><span style="width:34px;text-align:right">${u}%</span></div>`; }
  h += `<h3>전력 분해 (kWh)</h3><table>`; for (const [id, v] of Object.entries(k.energy.by_asset).sort((a,b)=>b[1]-a[1]).slice(0, 8)) h += `<tr><td>${id}</td><td>${v}</td></tr>`; h += '</table>';
  $('#kpi').innerHTML = h;
}

async function loadScenario(id) {
  const [f, k, txt] = await Promise.all([fetch(OUT + id + '/factory.json').then(r => r.json()), fetch(OUT + id + '/kpis.json').then(r => r.json()), fetch(OUT + id + '/events.jsonl').then(r => r.text())]);
  factory = f; kpis = k; events = txt.trim().split('\n').map(JSON.parse);
  buildFactory(f); indexEvents(events); renderKpi(k); seek(hhmm(f.meta.shift.start)); playing = false; $('#play').textContent = '▶ 재생';
}
async function init() {
  let idx = [{ id:'baseline', name:'baseline' }]; try { idx = await fetch(OUT + 'index.json').then(r => r.json()); } catch (e) {}
  $('#scn').innerHTML = idx.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  $('#scn').onchange = e => loadScenario(e.target.value);
  await loadScenario(idx[0].id); requestAnimationFrame(animate);
}
init().catch(e => { $('#info').textContent = '로드 실패: ' + e + '\n\n먼저 sim/compare.py 를 실행하고, 프로젝트 루트에서 `python3 -m http.server 8000` 후 http://localhost:8000/viewer/ 로 여세요.'; });
</script>
</body>
</html>
